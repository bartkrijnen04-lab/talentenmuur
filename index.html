
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talentenmuur | Tussenstand</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

.scherm {
  position: relative;
  height: 100vh;
  width: auto;
  aspect-ratio: 9 / 16;
  max-width: 100vw;
  margin: 0 auto;

  background-image: url("achtergrond.png");
  background-position: center;
  background-repeat: no-repeat;
  background-size: 100% 100%;
}
    }

.bedrag {
  position: absolute;
  top: 29%;
  left: 0;
  width: 100%;
  text-align: center;
  color: white;
  font-size: min(10vw, 7vh);
  font-weight: 900;
  line-height: 1;
  z-index: 10;
}
    }
  </style>
</head>

<body>
  <main class="scherm">
    <div class="bedrag" id="totaal">€ 8.350</div>
  </main>

  <script>
    const csvUrl =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vQSpkm1A4G9MWbWt83zy-FDVsYveeA7ONkCzfNmPIOvP2W7EjDzPas9-9E4upCjctGajorZL7cnDNoQ/pub?gid=0&single=true&output=csv";

    async function updateTotaal() {
      try {
        const url = csvUrl + "&t=" + Date.now();

        const response = await fetch(url, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Google Sheets niet bereikbaar");
        }

        const csv = await response.text();
        const regels = csv.trim().split(/\r?\n/);

        // A1 = Totaal, A2 = het sponsorbedrag
        const waarde = regels[1].split(",")[0]
          .replace(/"/g, "")
          .trim();

        const bedrag = Number(
          waarde.replace(/\./g, "").replace(",", ".")
        );

        if (!Number.isFinite(bedrag)) {
          throw new Error("Ongeldig sponsorbedrag");
        }

        document.getElementById("totaal").textContent =
          new Intl.NumberFormat("nl-NL", {
            style: "currency",
            currency: "EUR",
            maximumFractionDigits: 0
          }).format(bedrag);

      } catch (error) {
        console.error("Bijwerken mislukt:", error);
      }
    }

    updateTotaal();

    // Controleer elke minuut op wijzigingen
    setInterval(updateTotaal, 60000);
  </script>
</body>
</html>
