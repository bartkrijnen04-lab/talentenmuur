
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talentenmuur | Tussenstand</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .scherm {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-image: url("achtergrond.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: 100% 100%;
    }

    .bedrag {
      position: absolute;
      top: 32%;
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-size: clamp(48px, 8vw, 140px);
      font-weight: 900;
    }
  </style>
</head>

<body>
  <main class="scherm">
    <div class="bedrag" id="totaal">€ 8.350</div>
  </main>

  <script>
    const csvUrl =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vQSpkm1A4G9MWbWt83zy-FDVsYveeA7ONkCzfNmPIOvP2W7EjDzPas9-9E4upCjctGajorZL7cnDNoQ/pub?gid=0&single=true&output=csv";

    async function updateTotaal() {
      try {
        const url = csvUrl + "&t=" + Date.now();

        const response = await fetch(url, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Google Sheets niet bereikbaar");
        }

        const csv = await response.text();
        const regels = csv.trim().split(/\r?\n/);

        // A1 = Totaal, A2 = het sponsorbedrag
        const waarde = regels[1].split(",")[0]
          .replace(/"/g, "")
          .trim();

        const bedrag = Number(
          waarde.replace(/\./g, "").replace(",", ".")
        );

        if (!Number.isFinite(bedrag)) {
          throw new Error("Ongeldig sponsorbedrag");
        }

        document.getElementById("totaal").textContent =
          new Intl.NumberFormat("nl-NL", {
            style: "currency",
            currency: "EUR",
            maximumFractionDigits: 0
          }).format(bedrag);

      } catch (error) {
        console.error("Bijwerken mislukt:", error);
      }
    }

    updateTotaal();

    // Controleer elke minuut op wijzigingen
    setInterval(updateTotaal, 60000);
  </script>
</body>
</html>
